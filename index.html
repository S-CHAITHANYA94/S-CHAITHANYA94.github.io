<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Silent Love Letter</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  padding: 0;
  background-color: #8e2b4a;
}

/* Wrapper */
.envlope-wrapper {
  height: 420px;
}

/* Envelope */
#envelope {
  position: relative;
  width: 280px;
  height: 180px;
  margin: auto;
  top: 120px;
  background-color: #a73a5e;
  border-bottom-left-radius: 6px;
  border-bottom-right-radius: 6px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

/* Front */
.front {
  position: absolute;
  width: 0;
  height: 0;
  z-index: 3;
}

.flap {
  border-left: 140px solid transparent;
  border-right: 140px solid transparent;
  border-top: 98px solid #a73a5e;
  border-bottom: 82px solid transparent;
  transform-origin: top;
}

.pocket {
  border-left: 140px solid #f6a6b6;
  border-right: 140px solid #f6a6b6;
  border-bottom: 90px solid #e66b88;
  border-top: 90px solid transparent;
  border-bottom-left-radius: 6px;
  border-bottom-right-radius: 6px;
}

/* Letter */
.letter {
  position: relative;
  width: 92%;
  height: 92%;
  background-color: #fff;
  margin: auto;
  top: 4%;
  border-radius: 6px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.2);
  font-family: "Sans-Serif", cursive;
  color: #5a1025;
  padding: 14px;
  box-sizing: border-box;
}

/* Letter text */
.words {
  position: relative;
  text-align: center;
  margin-bottom: 8px;
}

.words {
  font-size: 0.9rem;     /* 👈 SAME SIZE FOR ALL */
  line-height: 1;
  text-align: center;
}

/* Open / Close */
.open .flap {
  transform: rotateX(180deg);
  transition: transform 0.4s ease;
  z-index: 1;
}

.close .flap {
  transform: rotateX(0deg);
  transition: transform 0.4s 0.6s ease;
  z-index: 5;
}

.open .letter {
  transform: translateY(-100px);
  transition: transform 0.4s 0.6s ease;
  z-index: 2;
}

.close .letter {
  transform: translateY(0);
  transition: transform 0.4s ease;
  z-index: 1;
}

/* Hearts */
.hearts {
  position: absolute;
  top: 90px;
  left: 0;
  right: 0;
  z-index: 2;
  pointer-events: none;
}

.heart {
  position: absolute;
  bottom: 0;
  width: 40px;
  height: 40px;
}

.left-heart { left: 15px; }
.right-heart { right: 15px; }

.heart:before,
.heart:after {
  content: "";
  position: absolute;
  width: 20px;
  height: 32px;
  background: linear-gradient(135deg,#ff5fa2,#ff9acb);
  border-radius: 20px 20px 0 0;
}

.heart:before {
  left: 20px;
  transform: rotate(-45deg);
  transform-origin: 0 100%;
}

.heart:after {
  left: 0;
  transform: rotate(45deg);
  transform-origin: 100% 100%;
}

.open .left-heart {
  animation: floatUp 5s linear forwards;
}

.open .right-heart {
  animation: floatUp 5.6s linear forwards;
}

@keyframes floatUp {
  0% { top: 0; opacity: 1; }
  100% { top: -520px; opacity: 0; }
}

/* Buttons */
.reset {
  text-align: center;
  margin-top: 170px;
}

.reset button {
  background-color: #f7c1cd;
  border: 2px solid #8e2b4a;
  color: #8e2b4a;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 700;
  border-radius: 6px;
  margin: 5px;
  cursor: pointer;
}

.reset button:hover {
  background-color: #8e2b4a;
  color: #fff;
}
</style>
</head>

<body>

<div class="envlope-wrapper">
  <div id="envelope" class="close">

    <div class="front flap"></div>
    <div class="front pocket"></div>

    <div class="letter">
      <div class="words line2">To: Someone who made me fall in love</div>

      <div class="words line3">
        I never spoke my feelings,<br>
        but my eyes always searched for you,
        in every crowded room,<br>
        loving you quietly from a distance.
      </div>
    </div>

    <div class="hearts">
      <div class="heart left-heart"></div>
      <div class="heart right-heart"></div>
    </div>

  </div>
</div>

<div class="reset">
  <button onclick="openEnvelope()">OPEN</button>
  <button onclick="closeEnvelope()">CLOSE</button>
</div>

<script>
function openEnvelope() {
  const env = document.getElementById("envelope");
  env.classList.remove("close");
  env.classList.add("open");
}

function closeEnvelope() {
  const env = document.getElementById("envelope");
  env.classList.remove("open");
  env.classList.add("close");
}
</script>

</body>
</html>
